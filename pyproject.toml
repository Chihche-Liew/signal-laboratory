[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siglab"
version = "0.1.0"
description = "Signal Laboratory — Academic asset pricing test suite for fundamental signal research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "wrds>=3.1",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "pandas-datareader>=0.10",
    "python-dotenv>=1.0",
    "anthropic>=0.25",
    "threadpoolctl>=3.1",
    "tqdm>=4.60",
]

[project.optional-dependencies]
paper = [
    "matplotlib>=3.7",
]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siglab = ["configs/*.yaml"]
