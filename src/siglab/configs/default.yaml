# siglab packaged defaults — ONLY keys the code actually reads live here.
#
# data.cache_dir is consumed by siglab.data.cache. Everything about a RUN
# (themes, proposer topology, generations, budgets, evaluator filters,
# posthoc suites, ...) lives in RunSpec YAMLs under paper/configs/,
# NOT in this file. Do not add "documentation" keys here: dead config that
# contradicts hardcoded defaults is how the old configs/default.yaml lied
# about min_coverage / newey_west_lags / start_date.

data:
  cache_dir: "data/cache"
